{% extends "admin/base.html" %}

{% block title %}Admin Registration{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5 col-md-7">

        <div class="custom-card">

            <div class="text-center mb-4">

                <i class="fas fa-user-plus fa-4x text-primary mb-3"></i>

                <h2 class="page-title">

                    Admin Registration

                </h2>

                <p class="page-subtitle">

                    Create your SmartCart Admin account

                </p>

            </div>

            <form method="POST"
                  action="{{ url_for('admin_signup') }}">

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Full Name

                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter your full name"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Email Address

                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>

                <div class="d-grid">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fas fa-paper-plane"></i>
                        Send OTP

                    </button>

                </div>

            </form>

            <hr>

            <div class="text-center">

                <p class="mb-0">

                    Already have an account?

                    <a href="{{ url_for('admin_login') }}"
                       class="text-decoration-none fw-bold">

                        Login Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
