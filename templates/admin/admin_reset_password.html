{% extends "admin/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5 col-md-7">

        <div class="custom-card">

            <div class="text-center mb-4">

                <i class="fas fa-lock fa-4x text-primary mb-3"></i>

                <h2 class="page-title">
                    Reset Password
                </h2>

                <p class="page-subtitle">
                    Enter OTP and create a new password
                </p>

            </div>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        OTP
                    </label>

                    <input type="text"
                           name="otp"
                           class="form-control"
                           placeholder="Enter OTP"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        New Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter New Password"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Confirm Password
                    </label>

                    <input type="password"
                           name="confirm_password"
                           class="form-control"
                           placeholder="Confirm Password"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit"
                            class="btn btn-primary">

                        Reset Password

                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
