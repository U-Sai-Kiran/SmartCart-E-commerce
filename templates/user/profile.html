{% extends "user/base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-body p-5">

            <h2 class="text-center mb-4">
                My Profile
            </h2>

            <form method="POST"
                  action="{{ url_for('profile') }}"
                  enctype="multipart/form-data">

                <!-- Profile Image -->

                <div class="text-center mb-4">

                    {% if user.profile_image %}
                        <img src="{{ url_for('static',
                            filename='uploads/profile_images/' + user.profile_image) }}"
                             class="rounded-circle"
                             width="150"
                             height="150">
                    {% else %}
                        <img src="https://via.placeholder.com/150"
                             class="rounded-circle">
                    {% endif %}

                </div>

                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{ user.name }}"
                           class="form-control"
                           required>

                </div>

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           value="{{ user.email }}"
                           class="form-control"
                           required>

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        New Password (Optional)
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control">

                </div>

                <!-- Profile Image Upload -->

                <div class="mb-4">

                    <label class="form-label">
                        Upload New Profile Picture
                    </label>

                    <input type="file"
                           name="profile_image"
                           class="form-control">

                </div>

                <div class="d-flex gap-3">

                    <button type="submit"
                            class="btn btn-primary">

                        Update Profile

                    </button>

                    <a href="{{ url_for('logout') }}"
                       class="btn btn-danger">

                        Logout

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
