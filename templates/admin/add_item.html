{% extends "admin/base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="custom-card">

            <div class="text-center mb-4">

                <h2 class="page-title">

                    Add New Product

                </h2>

                <p class="page-subtitle">

                    Add products to your SmartCart store.

                </p>

            </div>

            <form method="POST"
                  action="{{ url_for('add_item') }}"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Product Name

                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter product name"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Description

                    </label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Enter product description"
                              required></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Category

                    </label>

                    <input type="text"
                           name="category"
                           class="form-control"
                           placeholder="Enter category"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Price

                    </label>

                    <input type="number"
                           step="0.01"
                           name="price"
                           class="form-control"
                           placeholder="Enter price"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Product Image

                    </label>

                    <input type="file"
                           name="image"
                           class="form-control"
                           accept="image/*"
                           required>

                </div>

                <div class="d-grid gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fas fa-plus-circle"></i>
                        Add Product

                    </button>

                    <a href="{{ url_for('admin_dashboard') }}"
                       class="btn btn-outline-secondary">

                        Back to Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
