{% extends "admin/base.html" %}

{% block title %}Update Product{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="custom-card">

                <div class="text-center mb-4">

                    <h2 class="page-title">

                        Update Product

                    </h2>

                    <p class="page-subtitle">

                        Edit product details and update product image.

                    </p>

                </div>

                <form method="POST"
                      action="{{ url_for('update_item', item_id=product.product_id) }}"
                      enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Product Name

                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ product.name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Description

                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4"
                                  required>{{ product.description }}</textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Category

                        </label>

                        <input type="text"
                               name="category"
                               class="form-control"
                               value="{{ product.category }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Price

                        </label>

                        <input type="number"
                               step="0.01"
                               name="price"
                               class="form-control"
                               value="{{ product.price }}"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Current Image

                        </label>

                        <div class="text-center">

                            <img src="{{ url_for('static',
                                filename='uploads/product_images/' + product.image) }}"
                                class="img-fluid rounded-4 border shadow-sm"
                                style="max-height:220px; object-fit:contain;">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Upload New Image (Optional)

                        </label>

                        <input type="file"
                               name="image"
                               class="form-control"
                               accept="image/*">

                    </div>

                    <div class="d-grid gap-2">

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fas fa-save"></i>
                            Update Product

                        </button>

                        <a href="{{ url_for('item_list') }}"
                           class="btn btn-outline-secondary">

                            Back to Products

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
